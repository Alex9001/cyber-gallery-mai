name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.3"
          - "8.4"
          - "8.5"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install development tools
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHP checks
        run: composer test

  node:
    name: Assets and block metadata
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install development tools
        run: npm ci

      - name: Verify JavaScript, assets, and block JSON
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser regressions
        run: npm run test:browser

  plugin-check:
    name: Staged distribution
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install development tools
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci

      - name: Build release artifact
        run: npm run build:zip

      # The official Plugin Check action installs every Requires Plugins slug
      # from WordPress.org. Mai Engine is distributed from its own repository,
      # so make the exact minimum release available to WordPress while checking
      # the staged Cyber build. The separately distributed Genesis/Mai theme
      # runtime is covered by tests/runtime-smoke.php on an authorized site.
      - name: Install WordPress test environment
        run: |
          npm install --global @wordpress/env@11.12.0
          cp tests/fixtures/plugin-check.wp-env.json .wp-env.json

      - name: Start staged-distribution environment
        run: wp-env start --update

      - name: Activate staged plugin
        run: |
          wp-env run cli wp plugin activate mai-engine
          wp-env run cli wp plugin activate mai-cyber-gallery
          wp-env run cli wp plugin status mai-cyber-gallery

      - name: Run strict Plugin Check against staged release
        shell: bash
        run: |
          plugin_check_output="$(
            wp-env run cli wp \
              --no-color \
              --require=wp-content/plugins/plugin-check/cli.php \
              plugin check mai-cyber-gallery \
              --format=strict-json \
              --ignore-codes=plugin_updater_detected 2>&1
          )"
          printf '%s\n' "$plugin_check_output"

          # Plugin Check reserves Update URI for non-directory distribution but
          # reports it as a WordPress.org-policy error. It is required here to
          # prevent update collisions for this externally distributed add-on.
          # An empty strict JSON array means no other findings remain. wp-env
          # appends its own success marker to that same output line, so match
          # the JSON token at the beginning rather than requiring a bare line.
          if ! grep -Eq '^\[\]' <<< "$plugin_check_output"; then
            echo 'Plugin Check reported one or more errors or warnings.' >&2
            exit 1
          fi

      - name: Stop WordPress test environment
        if: always()
        run: wp-env stop
